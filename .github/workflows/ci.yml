name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pulse_fx

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      POSTGRES_USER: pulse_fx
      POSTGRES_PASSWORD: pulse_fx_ci
      POSTGRES_DB: pulse_fx
      POSTGRES_PORT: 5433
      API_PORT: 3333
      WEB_PORT: 8080
      SYNC_INTERVAL_MINUTES: 15
      FRED_API_KEY: "00000000000000000000000000000000"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build
